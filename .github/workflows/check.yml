name: check

on:
  push:
  pull_request:

jobs:
  data-up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify data/ and README tables match scripts/generate.py
        run: python3 scripts/generate.py --check
